name: Update Statistics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Problem Index
        run: python scripts/build_index.py

      - name: Generate Statistics
        run: python scripts/update_stats.py

      - name: Commit Changes
        run: |
          # Author these commits as the repo owner, NOT as github-actions.
          # GitHub only counts a commit toward the contribution graph when the
          # author email is verified against that account -- commits authored by
          # actions@github.com are invisible on the graph.
          git config user.name  "Adil Sukumar"
          git config user.email "adilsukumar24@gmail.com"

          git add README.md INDEX.md

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "chore: refresh problem index and stats"
            git push
          )

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
